name: build

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/run-lint
  determine:
    needs: lint
    runs-on: ubuntu-latest
    outputs:
      plugin_count: ${{ steps.detect.outputs.plugin_count }}
      plugin_matrix: ${{ steps.detect.outputs.plugin_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Capture changed files
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          write_output_files: true
      - name: Detect impacted plugins
        id: detect
        run: |
          python scripts/detect_plugins.py \
            --files-from .github/outputs/all_changed_files.txt \
            --allow-empty \
            --allow-multiple \
            --default all \
            --github-output "$GITHUB_OUTPUT"
  build:
    needs: determine
    if: needs.determine.outputs.plugin_count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.determine.outputs.plugin_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Sync workspace
        run: uv sync --all-extras --all-groups
      - name: Build plugin ${{ matrix.plugin }}
        working-directory: plugins/${{ matrix.plugin }}
        run: uv build
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.plugin }}
          path: |
            plugins/${{ matrix.plugin }}/dist
          if-no-files-found: warn
