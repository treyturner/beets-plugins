name: nohirescd compatibility

on:
  # Run on every PR, not only those targeting main, so stacked PRs get coverage.
  pull_request:
    paths:
      - "plugins/nohirescd/**"
      - ".github/workflows/nohirescd-compatibility.yml"
  push:
    branches: ["main"]
    paths:
      - "plugins/nohirescd/**"
      - ".github/workflows/nohirescd-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    defaults:
      run:
        working-directory: plugins/nohirescd

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies
        run: uv sync --python "${{ matrix.python-version }}"
      - name: Type check with mypy
        run: uv run mypy
      - name: Type check with Pyright
        run: uv run pyright
      - name: Run tests
        run: uv run pytest

  minimum-beets:
    name: Beets 2.13 minimum
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/nohirescd

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install dependencies with minimum Beets
        run: |
          uv sync --python 3.11
          uv pip install "beets==2.13.0"
      - name: Run tests
        run: uv run --no-sync pytest
