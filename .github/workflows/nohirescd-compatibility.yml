name: nohirescd compatibility

on:
  pull_request:
    branches: ["main"]
    paths:
      - "plugins/nohirescd/**"
      - ".github/workflows/nohirescd-compatibility.yml"
  push:
    branches: ["main"]
    paths:
      - "plugins/nohirescd/**"
      - ".github/workflows/nohirescd-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    defaults:
      run:
        working-directory: plugins/nohirescd

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --python "${{ matrix.python-version }}"
      - name: Type check with mypy
        run: uv run mypy
      - name: Type check with Pyright
        run: uv run pyright
      - name: Run tests
        run: uv run pytest

  minimum-beets:
    name: Beets 2.13 minimum
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/nohirescd

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies with minimum Beets
        run: |
          uv sync --python 3.10
          uv pip install "beets==2.13.0"
      - name: Run tests
        run: uv run --no-sync pytest
