repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types_or: ["python"]
      - id: ruff-lint
        name: Ruff lint
        entry: uv run ruff check
        language: system
        types_or: ["python"]
      - id: mypy
        name: Type check with mypy
        entry: uv run mypy
        language: system
        pass_filenames: false
